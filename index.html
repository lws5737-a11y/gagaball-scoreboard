<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초등 가가볼 스코어보드 V26 (클라우드 동기화 에디션)</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #3498db; --secondary: #2ecc71; --danger: #e74c3c;
            --dark: #2c3e50; --light: #ecf0f1; --gray: #95a5a6; --warning: #f1c40f;
            --boy-color: #2980b9; --girl-color: #c0392b;
            --boy-bg: #e3f2fd; --girl-bg: #ffebee;
            --team-a-bg: #ffe0b2; --team-a-border: #ff9800;
            --team-b-bg: #f4ff81; --team-b-border: #76ff03;
        }
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f0f3f5; margin: 0; padding: 15px; color: var(--dark); overflow-x: hidden; }
        .container { max-width: 98%; margin: 0 auto; background: white; padding: 20px 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); min-height: 95vh; position: relative;}
        
        /* 👑 권한 제어 매직 CSS: body에 'is-admin' 클래스가 없으면 .admin-only 요소들은 싹 다 숨김! */
        body:not(.is-admin) .admin-only { display: none !important; }
        
        /* 상단 로그인 바 */
        .auth-bar { display: flex; justify-content: space-between; align-items: center; background: #e8f8f5; padding: 10px 20px; border-radius: 10px; margin-bottom: 20px; border: 2px solid #1abc9c; }
        .auth-info { font-size: 1.2rem; font-weight: bold; }
        .auth-status-badge { background: var(--gray); color: white; padding: 3px 10px; border-radius: 15px; font-size: 0.9rem; margin-left: 10px;}
        body.is-admin .auth-status-badge { background: var(--danger); content: '관리자'; }

        h1 { text-align: center; color: var(--dark); margin-bottom: 20px; }
        .creator-tag { font-size: 1.1rem; color: #7f8c8d; font-weight: normal; font-style: italic; margin-left: 10px; vertical-align: middle; }
        
        .view-section { display: none; }
        .view-section.active { display: block; }
        .input-group { background: #f9f9f9; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        input, select, textarea { padding: 10px; margin: 5px; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; }
        input[type="number"] { width: 80px; }
        textarea { width: 100%; height: 100px; box-sizing: border-box; }
        button { padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        
        .btn-main { background: var(--dark); color: white; }
        .btn-sub { background: var(--gray); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-attend { background: var(--secondary); color: white; }
        .btn-absent { background: var(--gray); color: white; opacity: 0.8; }
        .btn-nav { background: var(--dark); color: white; padding: 10px 20px; }
        .btn-rank { background: var(--warning); color: var(--dark); font-size: 1.1rem; padding: 10px 15px; }
        .btn-team { background: #8e44ad; color: white; font-size: 1.1rem; padding: 10px 15px; }
        .btn-timer { background: #e67e22; color: white; font-size: 1.1rem; padding: 10px 15px; }
        .btn-sm { padding: 5px 10px; font-size: 0.9rem; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #f2f2f2; }
        .class-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .class-card { background: var(--primary); color: white; padding: 30px; text-align: center; border-radius: 10px; cursor: pointer; font-size: 1.5rem; transition: 0.2s; }
        .class-card:hover { transform: translateY(-5px); background: #2980b9; }

        .header-info { border-bottom: 2px solid var(--dark); padding-bottom: 10px; margin-bottom: 15px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        .header-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        
        .draw-panel { background: #fff3cd; padding: 12px 15px; border-radius: 8px; display: flex; justify-content: space-between; }
        .scoreboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .score-item { background: #fff; border: 3px solid var(--primary); padding: 15px; border-radius: 12px; text-align: center; position: relative; }
        
        /* 출전 완료 어둡게 */
        .score-item.drawn { border-color: #bdc3c7 !important; background-color: #dcdde1 !important; opacity: 0.75; }
        .drawn-badge { display: none; position: absolute; top: -10px; right: -10px; background: var(--dark); color: white; padding: 5px 10px; border-radius: 15px; font-size: 0.9rem;}
        .score-item.drawn .drawn-badge { display: block; }
        
        .avatar-img { width: 85px; height: 85px; border-radius: 50%; margin: 0 auto 10px; display: block; background: #fdfdfd; object-fit: cover; }
        .score-item.drawn .avatar-img { filter: grayscale(70%); opacity: 0.9; border-color: #bdc3c7 !important; }
        .score-item .name { font-size: 1.8rem; font-weight: bold; margin-bottom: 5px; }
        .score-item .score-val { font-size: 3rem; font-weight: 800; color: var(--danger); margin: 5px 0; }
        .score-item.drawn .name { color: #555; }
        .score-item.drawn .score-val { color: #8e44ad; }
        
        .score-ctrl button { font-size: 1.5rem; width: 50px; background: var(--primary); color: white; }
        .score-ctrl button.minus { background: var(--danger); }
        .score-item.drawn .score-ctrl button { background: #95a5a6; }

        .inactive-grid .score-item { border-color: #ddd; background: #fdfdfd; opacity: 0.6; }
        .ranking-table { width: 100%; font-size: 1.3rem; margin-top: 20px;}
        .ranking-table th { background: var(--dark); color: white; padding: 15px; }
        .ranking-table td { padding: 15px; border-bottom: 1px solid #eee; text-align: center; }
        .rank-1 { background-color: #fff9c4; } .rank-2 { background-color: #f5f5f5; } .rank-3 { background-color: #ffe0b2; }

        .matchup-row { display: flex; gap: 15px; background: white; padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 2px solid #ecf0f1; }
        .team-card { flex: 1; display: flex; padding: 5px; border-radius: 12px; }
        .team-a { background: var(--team-a-bg); border-left: 8px solid var(--team-a-border); }
        .team-b { background: var(--team-b-bg); border-right: 8px solid var(--team-b-border); }
        .vs-badge { font-size: 3rem; font-weight: 900; display: flex; align-items: center; }
        .team-card-left { width: 130px; border-right: 2px dashed rgba(0,0,0,0.2); padding-right: 10px; margin-right: 10px; }
        .team-card-right { flex: 1; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start;}
        .team-member-badge { display: flex; align-items: center; padding: 5px 10px; border-radius: 10px; border: 2px solid; background: white;}
        .team-member-badge img { width: 40px; height: 40px; border-radius: 50%; margin-right: 8px;}

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 40px; border-radius: 20px; text-align: center; max-width: 900px; width: 90%; }
        .draw-result-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; margin-bottom: 20px; }
        .drawn-name-card { border: 5px solid var(--dark); padding: 15px; border-radius: 15px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="auth-bar">
        <div class="auth-info">
            상태: <span id="userEmailDisplay" style="color:var(--primary);">로그인 대기중...</span>
            <span id="adminBadge" class="auth-status-badge">관전자 모드</span>
        </div>
        <div>
            <button id="btnLogin" class="btn-main" onclick="signIn()">구글 로그인 (관리자용)</button>
            <button id="btnLogout" class="btn-sub" style="display:none;" onclick="signOutApp()">로그아웃</button>
        </div>
    </div>

    <div id="setupView" class="view-section active">
        <h1>학생 명단 등록 <span class="creator-tag">made by 우석쌤</span></h1>
        
        <div class="admin-only">
            <div class="input-group">
                <h3>엑셀 일괄 추가 (학년 | 반 | 번호 | 이름 | 성별)</h3>
                <textarea id="bulkInput" placeholder="복사한 내용을 여기에 붙여넣으세요."></textarea>
                <button class="btn-attend" onclick="addBulk()">일괄 등록</button>
            </div>
            <div class="input-group">
                <button class="btn-danger btn-sm" onclick="clearAllStudents()" style="margin-bottom: 10px;">로컬 명단 초기화</button>
                <h3>현재 대기 명단 (총 <span id="listCount">0</span>명)</h3>
                <table>
                    <thead><tr><th>학년</th><th>반</th><th>번호</th><th>이름</th><th>성별</th><th>관리</th></tr></thead>
                    <tbody id="studentListBody"></tbody>
                </table>
            </div>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <p style="color:var(--danger); font-weight:bold;">※ 클라우드(DB)에 저장된 반 목록을 불러옵니다.</p>
            <div id="classButtons" class="class-grid" style="margin-bottom: 20px;"></div>
            <button class="btn-nav admin-only" style="padding: 15px 40px; font-size: 1.2rem; background:var(--secondary);" onclick="uploadLocalToDB()">대기 명단을 새 반으로 DB에 등록</button>
        </div>
    </div>

    <div id="scoreView" class="view-section">
        <div class="header-info">
            <div class="header-top">
                <h2 style="margin: 0; font-size: 2rem;">
                    <span id="currentClassTitle">0학년 0반 스코어보드</span>
                    <span class="creator-tag">made by 우석쌤</span>
                </h2>
                <div class="header-controls">
                    <button class="btn-timer" onclick="openTimerSelectModal()">⏱️ 타이머</button>
                    <button class="btn-reset-score admin-only" onclick="resetAllScoresDB()">🔄 점수 초기화</button>
                    <select id="teamCountSelect" class="team-select admin-only"><option value="4">4팀</option><option value="6">6팀</option><option value="8" selected>8팀</option></select>
                    <button class="btn-team admin-only" onclick="generateTeams()">👥 팀 편성</button>
                    <button class="btn-rank" onclick="showRanking()">🏆 순위표</button>
                    <button class="btn-nav" onclick="switchView('setupView')">학급 변경</button>
                </div>
            </div>
            
            <div class="draw-panel admin-only">
                <div class="draw-controls">
                    <strong>🏆 추첨:</strong>
                    <input type="number" id="drawCount" min="1" max="20" value="8" style="width:50px;"> 명
                    <button class="btn-main" onclick="executeDraw('all')">전체</button>
                    <button class="btn-boy" onclick="executeDraw('남')">남학생</button>
                    <button class="btn-girl" onclick="executeDraw('여')">여학생</button>
                    <button class="btn-danger" onclick="resetDrawDB()">추첨 초기화</button>
                </div>
                <div class="draw-stats" id="drawStatsDisplay">대기: 0명</div>
            </div>
        </div>
        
        <div id="activeScoreboard" class="scoreboard-grid"></div>
        <div class="section-title">🛑 불참 / 참관 학생</div>
        <div id="inactiveScoreboard" class="scoreboard-grid inactive-grid"></div>
    </div>

    <div id="rankingView" class="view-section">
        <div class="header-info" style="text-align: center; position: relative;">
            <h1 style="margin: 0; color: var(--danger); font-size: 2.5rem;"><span id="rankingClassTitle">0학년 0반 순위표</span> <span class="creator-tag">made by 우석쌤</span></h1>
            <button class="btn-nav" style="position: absolute; right: 0; top: -10px;" onclick="switchView('scoreView')">◀ 스코어보드</button>
        </div>
        <table class="ranking-table">
            <thead><tr><th>순위</th><th>이름</th><th>점수</th></tr></thead>
            <tbody id="rankingTableBody"></tbody>
        </table>
    </div>

    <div id="teamView" class="view-section">
        <div class="header-info" style="text-align: center; position: relative;">
            <h1 style="margin: 0; color: var(--dark); font-size: 2.2rem;"><span id="teamClassTitle">대진표</span> <span class="creator-tag">made by 우석쌤</span></h1>
            <button class="btn-team admin-only" onclick="generateTeams()">🔄 다시 편성</button>
            <button class="btn-nav" style="position: absolute; right: 0; top: -10px;" onclick="switchView('scoreView')">◀ 스코어보드</button>
        </div>
        <div id="teamMatchupsContainer" style="margin-top: 10px;"></div>
    </div>
</div>

<div id="drawModal" class="modal-overlay">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h1 style="color:var(--danger);">🎉 참가 선수 🎉</h1>
        <div id="drawResultGrid" class="draw-result-grid"></div>
        <button class="btn-main" style="padding: 15px 40px; font-size: 1.5rem;" onclick="closeModal()">확인 및 닫기</button>
    </div>
</div>

<div id="timerSelectModal" class="modal-overlay" onclick="closeTimerSelectModal()">
    <div class="modal-content" style="max-width: 400px;" onclick="event.stopPropagation()">
        <h2 style="color: #e67e22;">⏱️ 가가볼 타이머</h2>
        <div style="display: flex; flex-direction: column; gap: 15px;">
            <button class="btn-main" style="padding: 20px; background: #e67e22;" onclick="window.open('https://youtu.be/Nn9Exxw5Gg4', '_blank'); closeTimerSelectModal();">99초 타이머</button>
            <button class="btn-main" style="padding: 20px; background: #d35400;" onclick="window.open('https://youtu.be/eVGSsArJF6k', '_blank'); closeTimerSelectModal();">60초 타이머</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyDWa8zndAQfi97tWFVrvd714gStkjLvKDI",
      authDomain: "gagaball-61671.firebaseapp.com",
      projectId: "gagaball-61671",
      storageBucket: "gagaball-61671.firebasestorage.app",
      messagingSenderId: "207119173037",
      appId: "1:207119173037:web:bdb6b8e4478ed334e90d24",
      measurementId: "G-V2H94QE1WZ"
    };

    // Firebase 초기화
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // 전역 변수
    let isAdmin = false;
    let localStudents = []; // 1단계 화면의 임시 대기열
    let cloudStudents = []; // DB에서 불러온 현재 반 학생들
    let currentDocId = "";  // "4-1" 형태
    let currentRenderedTeams = [];
    let unsubscribeSnapshot = null; // DB 실시간 리스너 해제용

    const ADMIN_EMAIL = "lws5737@gmail.com";
    const fallbackSVG = `data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2250%22%20fill%3D%22%23f1f2f6%22%2F%3E%3Ctext%20x%3D%2250%22%20y%3D%2268%22%20font-size%3D%2245%22%20text-anchor%3D%22middle%22%3E%F0%9F%91%A4%3C%2Ftext%3E%3C%2Fsvg%3E`;

    // Vercel에서도 끄떡없는 아바타 생성 (심플 & 안전한 옵션 조합)
    function generateDiceBearAvatar(name, gender) {
        const seed = encodeURIComponent(name + Math.random().toString(36).substring(7));
        const bgColors = ['b6e3f4','c0aede','d1d4f9','ffdfbf','ffd5dc','b2dfdb','f8bbd0'];
        const bg = bgColors[Math.floor(Math.random() * bgColors.length)];
        
        let tops = gender === '남' ? 'shortHair' : 'longHair';
        // API 요청 거절을 막기 위해 가장 단순하고 안정적인 파라미터만 사용
        return `https://api.dicebear.com/9.x/avataaars/svg?seed=${seed}&backgroundColor=${bg}&facialHairProbability=0`;
    }

    // --- 인증 (Auth) 로직 ---
    auth.onAuthStateChanged(user => {
        const emailDisplay = document.getElementById('userEmailDisplay');
        const badge = document.getElementById('adminBadge');
        if (user) {
            emailDisplay.innerText = user.email;
            document.getElementById('btnLogin').style.display = 'none';
            document.getElementById('btnLogout').style.display = 'inline-block';
            
            if (user.email === ADMIN_EMAIL) {
                isAdmin = true;
                document.body.classList.add('is-admin');
                badge.innerText = "우석쌤 (수정 가능)";
            } else {
                isAdmin = false;
                document.body.classList.remove('is-admin');
                badge.innerText = "관전자 (조회만)";
            }
        } else {
            isAdmin = false;
            document.body.classList.remove('is-admin');
            emailDisplay.innerText = "로그인 필요";
            badge.innerText = "관전자";
            document.getElementById('btnLogin').style.display = 'inline-block';
            document.getElementById('btnLogout').style.display = 'none';
        }
    });

    function signIn() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(err => alert("로그인 실패: " + err.message));
    }
    function signOutApp() { auth.signOut(); }

    function switchView(viewId) {
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        if(viewId === 'setupView') loadClassListFromDB();
    }

    // --- DB 학급 목록 불러오기 (시작 화면) ---
    function loadClassListFromDB() {
        const classBtns = document.getElementById('classButtons');
        classBtns.innerHTML = '불러오는 중...';
        db.collection('gagaball_classes').get().then(snap => {
            classBtns.innerHTML = '';
            if (snap.empty) { classBtns.innerHTML = '<p>등록된 반이 없습니다.</p>'; return; }
            
            snap.forEach(doc => {
                const btn = document.createElement('div');
                btn.className = 'class-card';
                btn.innerText = doc.id + "반"; // 예: "4-1반"
                btn.onclick = () => loadClassBoard(doc.id);
                classBtns.appendChild(btn);
            });
        }).catch(err => { classBtns.innerHTML = 'DB 연결 오류 (보안 규칙 또는 Config를 확인하세요)'; });
    }

    // --- 1단계: 로컬 명단 준비 (관리자용) ---
    function addBulk() {
        if(!isAdmin) return alert("관리자만 명단을 추가할 수 있습니다.");
        const text = document.getElementById('bulkInput').value.trim();
        if(!text) return;
        text.split('\n').forEach(line => {
            const cols = line.split('\t');
            if(cols.length >= 4) {
                const name = cols[3].trim();
                const gender = cols[4] ? cols[4].trim() : '미지정';
                localStudents.push({
                    grade: cols[0].trim(), classNum: cols[1].trim(), no: cols[2].trim(), name: name,
                    gender: gender, score: 0, isDrawn: false, isParticipating: true,
                    avatarUrl: generateDiceBearAvatar(name, gender)
                });
            }
        });
        document.getElementById('bulkInput').value = ""; renderLocalList();
    }
    function renderLocalList() {
        const tbody = document.getElementById('studentListBody'); tbody.innerHTML = '';
        document.getElementById('listCount').innerText = localStudents.length;
        localStudents.forEach((s, idx) => {
            tbody.innerHTML += `<tr><td>${s.grade}</td><td>${s.classNum}</td><td>${s.no}</td><td>${s.name}</td><td>${s.gender}</td><td>-</td></tr>`;
        });
    }
    function clearAllStudents() { localStudents = []; renderLocalList(); }

    // 대기 명단을 DB에 업로드하여 새 반 생성
    function uploadLocalToDB() {
        if(!isAdmin) return;
        if(localStudents.length === 0) return alert("대기 명단이 비어있습니다.");
        
        // 첫 번째 학생의 학년 반을 기준으로 문서 ID 생성
        const docId = `${localStudents[0].grade}-${localStudents[0].classNum}`;
        db.collection('gagaball_classes').doc(docId).set({
            students: localStudents
        }).then(() => {
            alert(`${docId}반 명단이 클라우드에 등록되었습니다!`);
            localStudents = []; renderLocalList();
            loadClassListFromDB();
        }).catch(err => alert("저장 실패: 권한이 없거나 설정이 잘못되었습니다."));
    }

    // --- DB 연동 스코어보드 핵심 로직 ---
    function loadClassBoard(docId) {
        currentDocId = docId;
        document.getElementById('currentClassTitle').innerText = `${docId}반 스코어보드`;
        switchView('scoreView');

        // 기존 리스너가 있다면 해제
        if(unsubscribeSnapshot) unsubscribeSnapshot();

        // 🌟 실시간 DB 동기화 (마법의 시작)
        unsubscribeSnapshot = db.collection('gagaball_classes').doc(docId).onSnapshot(doc => {
            if (doc.exists) {
                cloudStudents = doc.data().students || [];
                renderScoreboard();
            }
        });
    }

    // DB에 데이터 저장 (업데이트) 함수
    function syncToDB() {
        if(!isAdmin) return alert("수정 권한이 없습니다.");
        db.collection('gagaball_classes').doc(currentDocId).update({
            students: cloudStudents
        }).catch(err => console.error("동기화 에러:", err));
    }

    function renderScoreboard() {
        const activeBoard = document.getElementById('activeScoreboard');
        const inactiveBoard = document.getElementById('inactiveScoreboard');
        activeBoard.innerHTML = ''; inactiveBoard.innerHTML = '';
        
        let availableTotal = 0, availableBoys = 0, availableGirls = 0;
        
        // 정렬
        cloudStudents.sort((a, b) => parseInt(a.no) - parseInt(b.no));

        cloudStudents.forEach((s, idx) => {
            const drawnClass = s.isDrawn ? 'drawn' : '';
            const btnText = s.isParticipating ? '참석' : '불참';
            const btnClass = s.isParticipating ? 'btn-attend btn-sm' : 'btn-absent btn-sm';
            
            let borderStyle = s.gender === '남' ? 'var(--boy-color)' : (s.gender === '여' ? 'var(--girl-color)' : 'var(--primary)');
            if(!s.isParticipating || s.isDrawn) borderStyle = 'var(--gray)';

            if(s.isParticipating && !s.isDrawn) {
                availableTotal++;
                if(s.gender === '남') availableBoys++;
                if(s.gender === '여') availableGirls++;
            }

            let bgColor = s.isParticipating && !s.isDrawn ? (s.gender === '남' ? 'var(--boy-bg)' : 'var(--girl-bg)') : '#fff';

            // HTML 생성 (admin-only 클래스를 버튼에 적용하여 관전자는 클릭 못하게 숨김 처리)
            const cardHTML = `
                <div class="score-item ${drawnClass}" style="border-color: ${borderStyle}; background-color: ${bgColor};">
                    <div class="drawn-badge">완료</div>
                    <div class="top-actions">
                        <span class="info">${s.no}번</span>
                        <button class="${btnClass} admin-only" onclick="toggleParticipation(${idx})">${btnText}</button>
                    </div>
                    
                    <img src="${s.avatarUrl}" alt="avatar" class="avatar-img" onerror="this.onerror=null; this.src='${fallbackSVG}';" style="border-color: ${borderStyle};">
                    
                    <span class="name">${s.name} <span style="font-size:1rem;">(${s.gender})</span></span>
                    <div class="score-val">${s.score}</div>
                    <div class="score-ctrl admin-only">
                        <button onclick="changeScore(${idx}, 1)">+</button>
                        <button class="minus" onclick="changeScore(${idx}, -1)">-</button>
                    </div>
                </div>
            `;
            if(s.isParticipating) activeBoard.innerHTML += cardHTML;
            else inactiveBoard.innerHTML += cardHTML;
        });
        document.getElementById('drawStatsDisplay').innerText = `대기: 총 ${availableTotal}명 (남 ${availableBoys} / 여 ${availableGirls})`;
    }

    // DB 동기화를 거치는 점수/상태 변경 함수들
    function toggleParticipation(idx) {
        if(!isAdmin) return;
        cloudStudents[idx].isParticipating = !cloudStudents[idx].isParticipating;
        cloudStudents[idx].isDrawn = false;
        syncToDB(); // 즉시 DB로 쏘면, onSnapshot이 화면을 다시 그림
    }

    function changeScore(idx, val) {
        if(!isAdmin) return;
        cloudStudents[idx].score = Math.max(0, cloudStudents[idx].score + val);
        syncToDB();
        
        // 모달창이 열려있을 때 실시간 반영
        const modalSpan = document.getElementById(`modal-score-${idx}`);
        if(modalSpan) modalSpan.innerText = cloudStudents[idx].score;
    }

    function resetAllScoresDB() {
        if(!isAdmin) return;
        if(confirm("모든 학생의 점수를 0점으로 초기화하시겠습니까? (클라우드 반영)")) {
            cloudStudents.forEach(s => s.score = 0);
            syncToDB();
        }
    }

    function executeDraw(targetGender) {
        if(!isAdmin) return;
        const drawCount = parseInt(document.getElementById('drawCount').value, 10);
        let availableIndices = [];
        cloudStudents.forEach((s, idx) => {
            if(s.isParticipating && !s.isDrawn && (targetGender === 'all' || s.gender === targetGender)) {
                availableIndices.push(idx);
            }
        });
        
        if(availableIndices.length === 0) return alert(`현재 대기 중인 학생이 없습니다.`);

        const actualDrawCount = Math.min(drawCount, availableIndices.length);
        const pickedHTML = [];

        // 셔플
        for (let i = availableIndices.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [availableIndices[i], availableIndices[j]] = [availableIndices[j], availableIndices[i]];
        }

        // 뽑힌 학생 DB 상태 변경 및 모달 생성
        for(let i = 0; i < actualDrawCount; i++) {
            const realIdx = availableIndices[i];
            cloudStudents[realIdx].isDrawn = true;
            const s = cloudStudents[realIdx];
            
            let borderColor = s.gender === '남' ? 'var(--boy-color)' : 'var(--girl-color)';
            
            pickedHTML.push(`
                <div class="drawn-name-card" style="border-color: ${borderColor};">
                    <img src="${s.avatarUrl}" style="width: 80px; height: 80px; border-radius: 50%;">
                    <div class="name" style="font-size:2rem; font-weight:bold;">${s.name}</div>
                    <div style="font-size:1.5rem; color:var(--danger); display:flex; align-items:center; gap:10px; justify-content:center;">
                        <button class="btn-danger" style="border-radius:50%; width:40px; height:40px; padding:0;" onclick="changeScore(${realIdx}, -1)">-</button>
                        <span id="modal-score-${realIdx}">${s.score}</span>
                        <button class="btn-main" style="border-radius:50%; width:40px; height:40px; padding:0;" onclick="changeScore(${realIdx}, 1)">+</button>
                    </div>
                </div>
            `);
        }

        syncToDB(); // 뽑힘 처리 DB 전송
        document.getElementById('drawResultGrid').innerHTML = pickedHTML.join('');
        document.getElementById('drawModal').style.display = 'flex';
    }

    function resetDrawDB() {
        if(!isAdmin) return;
        if(confirm("추첨 기록을 초기화하시겠습니까?")) {
            cloudStudents.forEach(s => s.isDrawn = false);
            syncToDB();
        }
    }

    function closeModal() {
        document.getElementById('drawModal').style.display = 'none';
    }

    // 팀 편성 로직 (로컬에서 화면만 보여줌. 점수 추가 시 DB 갱신)
    function generateTeams() {
        if(!isAdmin) return;
        const numTeams = parseInt(document.getElementById('teamCountSelect').value, 10);
        let available = cloudStudents.map((s, idx) => ({...s, originalIndex: idx})).filter(s => s.isParticipating);

        if(available.length < numTeams) return alert(`참가 학생이 너무 적습니다.`);

        let boys = available.filter(s => s.gender === '남').sort((a, b) => b.score - a.score);
        let girls = available.filter(s => s.gender === '여').sort((a, b) => b.score - a.score);
        const teams = Array.from({length: numTeams}, (_, i) => ({ id: i + 1, members: [], score: 0 }));

        function distribute(group) {
            group.forEach(student => {
                let minMembers = Math.min(...teams.map(t => t.members.length));
                let eligibleTeams = teams.filter(t => t.members.length === minMembers);
                eligibleTeams.sort(() => Math.random() - 0.5); 
                eligibleTeams.sort((a, b) => a.score - b.score); 
                eligibleTeams[0].members.push(student);
                eligibleTeams[0].score += student.score;
            });
        }
        distribute(boys); distribute(girls);
        currentRenderedTeams = teams;
        renderTeamView();
        switchView('teamView');
    }

    function renderTeamView() {
        const container = document.getElementById('teamMatchupsContainer');
        container.innerHTML = '';
        for(let i = 0; i < currentRenderedTeams.length; i += 2) {
            const teamA = currentRenderedTeams[i]; const teamB = currentRenderedTeams[i+1];
            
            const createBadges = (members) => members.map(m => `
                <div class="team-member-badge" style="border-color:${m.gender==='남'?'var(--boy-color)':'var(--girl-color)'};">
                    <img src="${m.avatarUrl}" onerror="this.src='${fallbackSVG}';">
                    <div><b>${m.name}</b> <span style="color:var(--danger);">${m.score}점</span></div>
                </div>`).join('');

            const createPanel = (team) => `
                <div class="team-card-left">
                    <div style="font-size:2rem; font-weight:bold;">${team.id}팀</div>
                    <div class="admin-only" style="margin-top:auto;">
                        <input type="number" id="ts-${team.id}" value="1" style="width:40px; text-align:center; padding:5px;">
                        <button class="btn-main" style="width:100%; margin-top:5px;" onclick="addTeamScoreDB(${team.id})">점수부여</button>
                    </div>
                </div>
            `;

            container.innerHTML += `
                <div class="matchup-row">
                    <div class="team-card team-a">${createPanel(teamA)} <div class="team-card-right">${createBadges(teamA.members)}</div></div>
                    ${teamB ? `<div class="vs-badge">VS</div><div class="team-card team-b">${createPanel(teamB)} <div class="team-card-right">${createBadges(teamB.members)}</div></div>` : ''}
                </div>`;
        }
    }

    function addTeamScoreDB(teamId) {
        if(!isAdmin) return;
        const val = parseInt(document.getElementById(`ts-${teamId}`).value, 10);
        if(isNaN(val) || val === 0) return;
        
        const team = currentRenderedTeams.find(t => t.id === teamId);
        team.members.forEach(m => {
            cloudStudents[m.originalIndex].score = Math.max(0, cloudStudents[m.originalIndex].score + val);
            m.score = cloudStudents[m.originalIndex].score; // 로컬 화면 갱신용
        });
        syncToDB(); // DB 반영
        renderTeamView(); // 팀 대진표 다시 그리기 (점수 텍스트 갱신)
    }

    // 올림픽 팡파르 (순위표 전용)
    function playRankingSound() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const playNote = (f, t, d) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'square'; 
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = f;
                
                gain.gain.setValueAtTime(0, ctx.currentTime + t);
                gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + t + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + t + d);
                
                osc.start(ctx.currentTime + t);
                osc.stop(ctx.currentTime + t + d);
            };

            playNote(392.00, 0.0, 0.4); 
            playNote(523.25, 0.3, 0.4); 
            playNote(659.25, 0.6, 0.4); 
            
            playNote(261.63, 0.9, 2.5); 
            playNote(523.25, 0.9, 2.5); 
            playNote(659.25, 0.9, 2.5); 
            playNote(783.99, 0.9, 2.5); 
            
        } catch(e) {}
    }

    function createConfetti() {
        const colors = ['#f1c40f', '#e74c3c', '#3498db', '#2ecc71', '#9b59b6'];
        for(let i=0; i<50; i++) {
            const conf = document.createElement('div'); conf.className = 'confetti';
            conf.style.left = Math.random() * 100 + 'vw'; conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            conf.style.animationDuration = (Math.random() * 2 + 1) + 's';
            document.body.appendChild(conf); setTimeout(() => conf.remove(), 3000);
        }
    }

    function showRanking() {
        const tbody = document.getElementById('rankingTableBody'); tbody.innerHTML = '';
        document.getElementById('rankingClassTitle').innerText = `${currentDocId}반 최종 순위`;
        
        let rankStudents = cloudStudents.filter(s => s.isParticipating);
        rankStudents.sort((a, b) => b.score - a.score || parseInt(a.no) - parseInt(b.no));
        
        if (rankStudents.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3">참가 학생이 없습니다.</td></tr>';
            switchView('rankingView'); return;
        }

        let currentRank = 1; let previousScore = -1;
        rankStudents.forEach((s, index) => {
            if (s.score !== previousScore) { currentRank = index + 1; previousScore = s.score; }
            let rowClass = currentRank === 1 ? 'rank-1' : (currentRank === 2 ? 'rank-2' : (currentRank === 3 ? 'rank-3' : ''));
            
            tbody.innerHTML += `
                <tr class="${rowClass}">
                    <td style="font-size: 2rem;"><strong>${currentRank}위</strong></td>
                    <td style="font-size: 2rem; font-weight:bold;">
                        <img src="${s.avatarUrl}" style="width:50px; border-radius:50%; vertical-align:middle; margin-right:10px;" onerror="this.src='${fallbackSVG}';">
                        ${s.name} <span style="font-size:1rem; color:#888;">(${s.gender})</span>
                    </td>
                    <td style="color:var(--danger); font-size:2.5rem; font-weight:bold;">${s.score}점</td>
                </tr>`;
        });
        
        switchView('rankingView');
        playRankingSound();
        createConfetti();
    }

    function openTimerSelectModal() { document.getElementById('timerSelectModal').style.display = 'flex'; }
    function closeTimerSelectModal() { document.getElementById('timerSelectModal').style.display = 'none'; }

    // 초기 실행 (로컬 명단이 비어있으면 DB에서 불러오기)
    loadClassListFromDB();
</script>
</body>
</html>
